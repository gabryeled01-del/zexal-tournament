<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control"
content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
content="no-cache">

content="0">

<title>Calendario — ALIS Duelist System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: 'Orbitron', sans-serif;
    color: white;
    overflow-x: hidden;
}


/* =========================================================
   SFONDO
========================================================= */

body {

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(0,213,255,0.15),
            transparent 32%
        ),

        radial-gradient(
            circle at 0% 65%,
            rgba(0,112,255,0.08),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #020914 0%,
            #041322 50%,
            #020812 100%
        );
}


body::before {

    content: "";

    position: fixed;
    inset: -80px;

    z-index: -3;

    background-image:

        linear-gradient(
            rgba(0,220,255,0.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,220,255,0.045) 1px,
            transparent 1px
        );

    background-size:
        42px 42px;

    transform:
        perspective(600px)
        rotateX(58deg)
        scale(1.8)
        translateY(80px);

    transform-origin:
        center bottom;

    animation:
        gridMove 18s linear infinite;

    pointer-events: none;
}


@keyframes gridMove {

    from {
        background-position:
            0 0,
            0 0;
    }

    to {
        background-position:
            0 42px,
            42px 0;
    }
}


body::after {

    content: "";

    position: fixed;
    inset: 0;

    z-index: -2;

    pointer-events: none;

    background:

        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,0.32) 100%
        );
}


/* =========================================================
   PAGINA
========================================================= */

.page {

    width: 100%;
    max-width: 560px;

    margin: 0 auto;

    padding:
        18px
        14px
        35px;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 18px;
}


.back {

    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(125,235,255,0.25);

    background:
        rgba(4,30,50,0.55);

    color: white;

    text-decoration: none;

    font-family:
        Arial,
        sans-serif;

    font-size: 22px;
}


.back:active {
    transform: scale(0.90);
}


.brand {
    flex: 1;
    text-align: center;
}


.brand-main {

    font-size: 14px;
    font-weight: 700;

    letter-spacing:
        2.2px;

    text-shadow:
        0 0 8px
        rgba(0,220,255,0.55);
}


.brand-sub {

    margin-top: 4px;

    font-size: 6px;

    letter-spacing:
        2.5px;

    color:
        rgba(175,235,255,0.55);
}


.header-space {
    width: 34px;
}


/* =========================================================
   TITOLO
========================================================= */

.section-header {

    display: flex;
    align-items: center;

    gap: 10px;

    margin-bottom: 12px;
}


.section-line {

    flex: 1;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,220,255,0.45)
        );
}


.section-line.right {

    background:

        linear-gradient(
            90deg,
            rgba(0,220,255,0.45),
            transparent
        );
}


.section-title {

    font-size: 8px;

    letter-spacing:
        2px;

    font-weight: 700;

    color:
        rgba(220,250,255,0.9);
}


.intro {

    margin-bottom: 16px;

    text-align: center;

    font-size: 6px;

    letter-spacing:
        1.2px;

    color:
        rgba(160,225,245,0.45);
}


/* =========================================================
   GIRONE
========================================================= */

.groups {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    margin-bottom: 15px;
}


.group-button {

    min-height: 57px;

    padding:
        8px 3px;

    border-radius: 14px;

    border:
        1px solid
        rgba(125,235,255,0.18);

    background:

        linear-gradient(
            145deg,
            rgba(18,65,90,0.42),
            rgba(4,27,48,0.58)
        );

    color:
        rgba(180,235,250,0.55);

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 5.5px;

    font-weight: 700;

    letter-spacing:
        0.8px;

    cursor: pointer;
}


.group-number {

    display: block;

    margin-top: 5px;

    font-size: 16px;

    color:
        rgba(220,250,255,0.75);
}


.group-button.active {

    border-color:
        rgba(70,235,255,0.72);

    color: white;

    background:

        linear-gradient(
            145deg,
            rgba(0,135,180,0.42),
            rgba(3,45,70,0.78)
        );

    box-shadow:

        0 0 17px
        rgba(0,220,255,0.15),

        inset 0 0 13px
        rgba(0,220,255,0.06);
}


.group-button.active
.group-number {

    color: white;

    text-shadow:

        0 0 10px
        rgba(0,220,255,0.55);
}


/* =========================================================
   GIORNATE
========================================================= */

.sub-label {

    margin:
        2px
        0
        8px;

    text-align: center;

    font-size: 5px;

    letter-spacing:
        1.8px;

    color:
        rgba(150,225,245,0.42);
}


.days {

    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding:
        2px
        2px
        10px;

    scrollbar-width: none;

    scroll-behavior: smooth;
}


.days::-webkit-scrollbar {
    display: none;
}


.day-button {

    flex-shrink: 0;

    min-width: 91px;

    height: 43px;

    padding:
        0 11px;

    border-radius: 13px;

    border:
        1px solid
        rgba(125,235,255,0.18);

    background:

        linear-gradient(
            145deg,
            rgba(18,65,90,0.42),
            rgba(4,27,48,0.58)
        );

    color:
        rgba(190,240,250,0.55);

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 5.5px;

    font-weight: 700;

    letter-spacing:
        0.8px;

    cursor: pointer;

    white-space: nowrap;
}


.day-button.active {

    color: white;

    border-color:
        rgba(80,235,255,0.70);

    background:

        linear-gradient(
            145deg,
            rgba(0,130,175,0.38),
            rgba(3,45,70,0.70)
        );

    box-shadow:

        0 0 15px
        rgba(0,220,255,0.12);
}


/* =========================================================
   TITOLO GIORNATA
========================================================= */

.day-title {

    margin:
        11px
        0
        10px;

    text-align: center;

    font-size: 8px;

    font-weight: 700;

    letter-spacing:
        1.7px;

    color:
        rgba(215,248,255,0.85);
}


.day-count {

    margin-top: 5px;

    font-size: 5px;

    font-weight: 500;

    letter-spacing:
        1.2px;

    color:
        rgba(150,225,240,0.42);
}


/* =========================================================
   LISTA
========================================================= */

.matches {

    display: flex;

    flex-direction: column;

    gap: 9px;
}


/* =========================================================
   CARD DUELLO
========================================================= */

.match-card {

    position: relative;

    width: 100%;

    min-height: 126px;

    padding:
        13px
        12px;

    border-radius: 18px;

    border:
        1px solid
        rgba(135,235,255,0.18);

    background:

        linear-gradient(
            135deg,
            rgba(15,61,85,0.46),
            rgba(3,25,43,0.64)
        );

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.045),

        0 10px 25px
        rgba(0,0,0,0.20);

    overflow: hidden;
}


.match-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 15%;
    right: 15%;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(80,235,255,0.65),
            transparent
        );
}


.match-number {

    margin-bottom: 11px;

    text-align: center;

    font-size: 5px;

    letter-spacing:
        1.5px;

    color:
        rgba(150,225,240,0.42);
}


/* =========================================================
   GIOCATORI
========================================================= */

.players {

    display: grid;

    grid-template-columns:
        minmax(0,1fr)
        42px
        minmax(0,1fr);

    align-items: center;

    gap: 6px;
}


.player {

    min-width: 0;

    text-align: center;
}


.player-name {

    font-size: 11px;

    font-weight: 700;

    letter-spacing:
        1px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.player-lp {

    margin-top: 7px;

    min-height: 12px;

    font-family:
        Arial,
        sans-serif;

    font-size: 9px;

    font-weight: 700;

    color:
        rgba(190,235,245,0.55);
}


.vs {

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 700;

    color:
        rgba(145,230,250,0.45);
}


/* =========================================================
   RISULTATI
========================================================= */

.player.winner
.player-name {

    color:
        #67ffc0;

    text-shadow:
        0 0 8px
        rgba(60,255,170,0.45);
}


.player.winner
.player-lp {
    color: #67ffc0;
}


.player.loser
.player-name {

    color:
        #ff7187;

    text-shadow:
        0 0 8px
        rgba(255,80,110,0.36);
}


.player.loser
.player-lp {
    color: #ff7187;
}


.player.draw
.player-name {

    color:
        #ffe878;
}


.player.draw
.player-lp {
    color: #ffe878;
}


/* =========================================================
   STATO
========================================================= */

.match-status {

    margin-top: 13px;

    padding-top: 9px;

    border-top:
        1px solid
        rgba(120,220,240,0.08);

    text-align: center;

    font-size: 5px;

    font-weight: 700;

    letter-spacing:
        1.5px;

    color:
        rgba(160,225,240,0.42);
}


.match-status.finished {

    color:
        rgba(110,255,195,0.68);
}


.match-status.draw {

    color:
        rgba(255,230,120,0.72);
}


/* =========================================================
   RIPOSO
========================================================= */

.rest-card {

    position: relative;

    margin-top: 5px;

    padding:
        15px
        12px;

    border-radius: 17px;

    border:
        1px solid
        rgba(180,150,255,0.20);

    background:

        linear-gradient(
            135deg,
            rgba(52,40,86,0.34),
            rgba(6,23,42,0.60)
        );

    text-align: center;

    overflow: hidden;

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.04),

        0 9px 22px
        rgba(0,0,0,0.18);
}


.rest-card::before {

    content: "";

    position: absolute;

    left: 25%;
    right: 25%;
    top: 0;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(185,155,255,0.60),
            transparent
        );
}


.rest-label {

    font-size: 5px;

    letter-spacing:
        1.7px;

    color:
        rgba(190,175,255,0.48);

    margin-bottom: 7px;
}


.rest-name {

    font-size: 11px;

    font-weight: 700;

    letter-spacing:
        1.3px;

    color:
        #d5c8ff;

    text-shadow:

        0 0 10px
        rgba(170,135,255,0.30);
}


.rest-icon {

    margin-right: 6px;

    font-family:
        Arial,
        sans-serif;
}


/* =========================================================
   MESSAGGI
========================================================= */

.message {

    padding:
        30px
        12px;

    text-align: center;

    border-radius: 17px;

    border:
        1px solid
        rgba(135,235,255,0.15);

    background:

        linear-gradient(
            145deg,
            rgba(14,50,70,0.36),
            rgba(4,27,48,0.48)
        );

    font-size: 7px;

    line-height: 1.8;

    letter-spacing:
        1.3px;

    color:
        rgba(150,225,245,0.45);
}


.error {
    color:
        rgba(255,110,130,0.75);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 28px;

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size: 7px;

    letter-spacing:
        1.5px;

    color:
        rgba(160,220,235,0.20);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 360px) {

    .page {
        padding:
            14px
            10px
            28px;
    }

    .groups {
        gap: 5px;
    }

    .group-button {
        min-height: 51px;
        font-size: 4.7px;
    }

    .group-number {
        font-size: 14px;
    }

    .day-button {
        min-width: 85px;
    }

    .player-name {
        font-size: 9px;
    }

    .player-lp {
        font-size: 8px;
    }

    .rest-name {
        font-size: 10px;
    }

}

</style>

</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://swbrwezlygmtsuudwlfg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_uV3FT9S9f6dajA4NRgofFA_cGOCvTNG";


/* =========================================================
   CONFIGURAZIONE
========================================================= */

const TOTAL_GROUPS =
    4;

const TOTAL_DAYS =
    7;

const DUELS_PER_DAY =
    3;


/* =========================================================
   DATI
========================================================= */

let calendarRows =
    [];

let duels =
    [];

let playersList =
    [];

let playerNames =
    {};

let selectedGroup =
    1;

let selectedDay =
    1;


/* =========================================================
   FETCH
========================================================= */

async function supabaseFetch(path) {

    const response =
        await fetch(

            SUPABASE_URL + path,

            {

                method:
                    "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                },

                cache:
                    "no-store"

            }

        );


    if (!response.ok) {

        throw new Error(
            await response.text()
        );

    }


    return await response.json();

}


/* =========================================================
   GIRONE
========================================================= */

function getGroup(match) {

    const value =
        Number(
            match.girone
        );


    if (
        Number.isFinite(value) &&
        value >= 1 &&
        value <= TOTAL_GROUPS
    ) {

        return value;

    }


    return 1;

}


/* =========================================================
   GIORNATA
========================================================= */

function getDay(match) {

    const value =
        Number(
            match.giornata
        );


    if (
        Number.isFinite(value) &&
        value >= 1 &&
        value <= TOTAL_DAYS
    ) {

        return value;

    }


    return 1;

}


/* =========================================================
   CARICAMENTO
========================================================= */

async function loadCalendar() {

    try {


        /* CALENDARIO */

        calendarRows =
            await supabaseFetch(

                "/rest/v1/calendario" +
                "?select=*" +
                "&order=girone.asc,giornata.asc"

            );


        /* DUELLANTI */

        playersList =
            await supabaseFetch(

                "/rest/v1/duellanti" +
                "?select=id,nome"

            );


        playerNames =
            {};


        playersList.forEach(

            function(player) {

                playerNames[
                    player.id
                ] =
                    player.nome ||
                    "DUELLANTE";

            }

        );


        /* RISULTATI */

        duels =
            await supabaseFetch(

                "/rest/v1/duelli" +
                "?select=*" +
                "&order=id.asc"

            );


        setupGroupButtons();

        renderDayButtons();

        renderMatches();


    }

    catch(error) {


        console.error(
            error
        );


        document.getElementById(
            "matches"
        ).innerHTML =

            '<div class="message error">' +

            'ERRORE NEL CARICAMENTO DEL CALENDARIO' +

            '<br><br>' +

            escapeHTML(
                error.message
            ) +

            '</div>';

    }

}


/* =========================================================
   BOTTONI GIRONE
========================================================= */

function setupGroupButtons() {

    const buttons =
        document.querySelectorAll(
            ".group-button"
        );


    buttons.forEach(

        function(button) {

            const group =
                Number(
                    button.dataset.group
                );


            button.classList.toggle(

                "active",

                group ===
                selectedGroup

            );


            button.onclick =
                function() {


                    selectedGroup =
                        group;


                    selectedDay =
                        1;


                    setupGroupButtons();

                    renderDayButtons();

                    renderMatches();


                    document.getElementById(
                        "days"
                    ).scrollLeft =
                        0;

                };

        }

    );

}


/* =========================================================
   7 GIORNATE FISSE
========================================================= */

function renderDayButtons() {

    const container =
        document.getElementById(
            "days"
        );


    container.innerHTML =
        "";


    for (
        let day = 1;
        day <= TOTAL_DAYS;
        day++
    ) {


        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "day-button";


        button.textContent =
            "GIORNATA " +
            day;


        if (
            day ===
            selectedDay
        ) {

            button.classList.add(
                "active"
            );

        }


        button.onclick =
            function() {


                selectedDay =
                    day;


                renderDayButtons();

                renderMatches();

            };


        container.appendChild(
            button
        );

    }

}


/* =========================================================
   TROVA RISULTATO
========================================================= */

function findPlayedDuel(match) {


    /* COLLEGAMENTO DIRETTO */

    if (
        match.link_id
    ) {


        const linked =
            duels.find(

                function(duel) {

                    return (

                        duel.calendario_link_id ===
                        match.link_id

                    );

                }

            );


        if (linked) {

            return linked;

        }

    }


    /* FALLBACK */

    return duels.find(

        function(duel) {


            const sameGroup =

                duel.girone === null ||
                duel.girone === undefined ||

                Number(
                    duel.girone
                ) ===
                getGroup(match);


            const samePlayers =

                (

                    duel.duellante_a ===
                    match.duellante_a

                    &&

                    duel.duellante_b ===
                    match.duellante_b

                )

                ||

                (

                    duel.duellante_a ===
                    match.duellante_b

                    &&

                    duel.duellante_b ===
                    match.duellante_a

                );


            return (

                sameGroup &&
                samePlayers

            );

        }

    ) || null;

}


/* =========================================================
   LP
========================================================= */

function getScores(
    match,
    duel
) {

    if (!duel) {

        return {

            lpA:
                null,

            lpB:
                null

        };

    }


    if (
        duel.duellante_a ===
        match.duellante_a
    ) {

        return {

            lpA:
                duel["LP_a"],

            lpB:
                duel["LP_b"]

        };

    }


    return {

        lpA:
            duel["LP_b"],

        lpB:
            duel["LP_a"]

    };

}


/* =========================================================
   MOSTRA GIORNATA
========================================================= */

function renderMatches() {

    const container =
        document.getElementById(
            "matches"
        );


    const title =
        document.getElementById(
            "dayTitle"
        );


    const matches =
        calendarRows.filter(

            function(match) {

                return (

                    getGroup(match) ===
                    selectedGroup

                    &&

                    getDay(match) ===
                    selectedDay

                );

            }

        );


    title.innerHTML =

        "GIRONE " +
        selectedGroup +

        " • GIORNATA " +
        selectedDay +

        '<div class="day-count">' +

        matches.length +

        " / 3 DUELLI PROGRAMMATI" +

        "</div>";


    container.innerHTML =
        "";


    if (
        matches.length === 0
    ) {


        container.innerHTML =

            '<div class="message">' +

            'GIORNATA NON ANCORA PROGRAMMATA' +

            '<br><br>' +

            'GIRONE ' +
            selectedGroup +

            ' • GIORNATA ' +
            selectedDay +

            '</div>';


        return;

    }


    matches.forEach(

        function(match,index) {

            createMatchCard(

                match,

                index + 1

            );

        }

    );


    /* =====================================================
       MOSTRA DUELLANTE A RIPOSO
    ===================================================== */

    renderRestingPlayer(
        matches
    );

}


/* =========================================================
   DUELLANTE A RIPOSO
========================================================= */

function renderRestingPlayer(matches) {


    /* -----------------------------------------------------
       Il riposo viene mostrato soltanto quando
       la giornata contiene tutti e 3 i duelli.
    ----------------------------------------------------- */

    if (
        matches.length !==
        DUELS_PER_DAY
    ) {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "rest-card";


        card.innerHTML = `

            <div class="rest-label">

                DUELLANTE A RIPOSO

            </div>

            <div class="rest-name">

                DA DEFINIRE

            </div>

        `;


        document.getElementById(
            "matches"
        ).appendChild(
            card
        );


        return;

    }


    /* -----------------------------------------------------
       ID dei 6 giocatori impegnati
    ----------------------------------------------------- */

    const playingIds =
        new Set();


    matches.forEach(

        function(match) {


            if (
                match.duellante_a
            ) {

                playingIds.add(
                    match.duellante_a
                );

            }


            if (
                match.duellante_b
            ) {

                playingIds.add(
                    match.duellante_b
                );

            }

        }

    );


    /* -----------------------------------------------------
       Cerca chi non compare nei 3 duelli
    ----------------------------------------------------- */

    const restingPlayers =
        playersList.filter(

            function(player) {

                return (
                    !playingIds.has(
                        player.id
                    )
                );

            }

        );


    /* -----------------------------------------------------
       Se esattamente uno non gioca, è lui a riposare.
    ----------------------------------------------------- */

    let restingName =
        "DA DEFINIRE";


    if (
        restingPlayers.length === 1
    ) {


        restingName =
            restingPlayers[0].nome ||
            "DUELLANTE";

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "rest-card";


    card.innerHTML = `

        <div class="rest-label">

            DUELLANTE A RIPOSO

        </div>


        <div class="rest-name">

            <span class="rest-icon">
                ◇
            </span>

            ${escapeHTML(restingName)}

        </div>

    `;


    document.getElementById(
        "matches"
    ).appendChild(
        card
    );

}


/* =========================================================
   CREA CARD DUELLO
========================================================= */

function createMatchCard(
    match,
    number
) {


    const duel =
        findPlayedDuel(
            match
        );


    const scores =
        getScores(
            match,
            duel
        );


    const lpA =
        scores.lpA;


    const lpB =
        scores.lpB;


    const completed =

        lpA !== null &&
        lpA !== undefined &&

        lpB !== null &&
        lpB !== undefined;


    let classA =
        "";

    let classB =
        "";

    let status =
        "IN PROGRAMMA";

    let statusClass =
        "";


    if (completed) {


        const valueA =
            Number(lpA);


        const valueB =
            Number(lpB);


        if (
            valueA >
            valueB
        ) {


            classA =
                "winner";


            classB =
                "loser";


            status =
                "FINALE";


            statusClass =
                "finished";

        }


        else if (
            valueB >
            valueA
        ) {


            classA =
                "loser";


            classB =
                "winner";


            status =
                "FINALE";


            statusClass =
                "finished";

        }


        else {


            classA =
                "draw";


            classB =
                "draw";


            status =
                "PAREGGIO";


            statusClass =
                "draw";

        }

    }


    const nameA =
        playerNames[
            match.duellante_a
        ] ||
        "DUELLANTE";


    const nameB =
        playerNames[
            match.duellante_b
        ] ||
        "DUELLANTE";


    const lpTextA =
        completed

            ? lpA + " LP"

            : "— LP";


    const lpTextB =
        completed

            ? lpB + " LP"

            : "— LP";


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "match-card";


    card.innerHTML = `

        <div class="match-number">

            DUELLO ${number}

        </div>


        <div class="players">


            <div class="player ${classA}">


                <div class="player-name">

                    ${escapeHTML(nameA)}

                </div>


                <div class="player-lp">

                    ${escapeHTML(lpTextA)}

                </div>


            </div>



            <div class="vs">

                VS

            </div>



            <div class="player ${classB}">


                <div class="player-name">

                    ${escapeHTML(nameB)}

                </div>


                <div class="player-lp">

                    ${escapeHTML(lpTextB)}

                </div>


            </div>


        </div>


        <div class="match-status ${statusClass}">

            ${status}

        </div>

    `;


    document.getElementById(
        "matches"
    ).appendChild(
        card
    );

}


/* =========================================================
   SICUREZZA TESTO
========================================================= */

function escapeHTML(text) {

    return String(
        text ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   AVVIO
========================================================= */

loadCalendar();


/* =========================================================
   AGGIORNAMENTO AUTOMATICO
========================================================= */

setInterval(

    loadCalendar,

    30000

);

<script>

(function(){

    const buttons =
        Array.from(
            document.querySelectorAll(
                "button"
            )
        );


    const dayButtons =
        buttons.filter(
            function(button){

                const text =
                    button.textContent
                    .trim()
                    .toUpperCase();


                return (

                    /^(GIORNO|GIORNATA)\s*[1-7]$/.test(text)

                    ||

                    /^[1-7]$/.test(text)

                );

            }
        );


    if(
        dayButtons.length >= 2
    ){

        const container =
            dayButtons[0].parentElement;


        if(container){

            container.classList.add(
                "alis-days-scroll"
            );

        }

    }

})();
