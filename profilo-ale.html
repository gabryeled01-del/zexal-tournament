<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control"
content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
content="no-cache">

<meta http-equiv="Expires"
content="0">

<title>Ale — ALIS Duelist System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: 'Orbitron', sans-serif;
    color: white;
    overflow-x: hidden;
}


/* =========================================================
   SFONDO
========================================================= */

body {

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(0,213,255,.15),
            transparent 32%
        ),

        radial-gradient(
            circle at 0% 65%,
            rgba(0,112,255,.08),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #020914,
            #041322 50%,
            #020812
        );
}


body::before {

    content: "";

    position: fixed;

    inset: -80px;

    z-index: -3;

    background-image:

        linear-gradient(
            rgba(0,220,255,.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,220,255,.045) 1px,
            transparent 1px
        );

    background-size:
        42px 42px;

    transform:
        perspective(600px)
        rotateX(58deg)
        scale(1.8)
        translateY(80px);

    transform-origin:
        center bottom;

    animation:
        gridMove 18s linear infinite;

    pointer-events: none;
}


@keyframes gridMove {

    to {

        background-position:
            0 42px,
            42px 0;

    }

}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -2;

    pointer-events: none;

    background:

        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,.32)
        );
}


/* =========================================================
   PAGINA
========================================================= */

.page {

    width: 100%;

    max-width: 560px;

    margin: 0 auto;

    padding:
        18px
        14px
        30px;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}


.back {

    width: 34px;

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(125,235,255,.25);

    background:
        rgba(4,30,50,.55);

    color: white;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 22px;
}


.back:active {

    transform:
        scale(.9);
}


.brand {

    flex: 1;

    text-align: center;
}


.brand-main {

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 2.2px;

    text-shadow:
        0 0 8px
        rgba(0,220,255,.55);
}


.brand-sub {

    margin-top: 4px;

    font-size: 6px;

    letter-spacing: 2.5px;

    color:
        rgba(175,235,255,.55);
}


.header-space {

    width: 34px;
}


/* =========================================================
   SEZIONI
========================================================= */

.section-header {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;
}


.section-line {

    flex: 1;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,220,255,.45)
        );
}


.section-line.right {

    background:

        linear-gradient(
            90deg,
            rgba(0,220,255,.45),
            transparent
        );
}


.section-title {

    font-size: 8px;

    letter-spacing: 2px;

    font-weight: 700;

    white-space: nowrap;

    color:
        rgba(220,250,255,.9);
}


/* =========================================================
   ID CARD
========================================================= */

.id-card {

    position: relative;

    width: 100%;

    padding: 17px;

    border-radius: 20px;

    border:
        1px solid
        rgba(130,235,255,.38);

    background:

        linear-gradient(
            135deg,
            rgba(14,64,89,.68),
            rgba(3,24,42,.82)
        );

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.08),

        0 15px 40px
        rgba(0,0,0,.35),

        0 0 25px
        rgba(0,200,255,.08);

    overflow: hidden;
}


.id-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 7%;

    right: 7%;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(80,235,255,.8),
            transparent
        );
}


.id-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;

    position: relative;

    z-index: 2;
}


.id-title {

    font-size: 7px;

    letter-spacing: 2.5px;

    color:
        rgba(170,235,250,.65);
}


.id-top-right {

    display: flex;

    align-items: center;

    gap: 9px;
}


.id-code {

    font-size: 6px;

    letter-spacing: 1.5px;

    color:
        rgba(130,220,240,.4);
}


/* =========================================================
   RANK A BRONZO
========================================================= */

.rank-badge {

    width: 34px;

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 9px;

    font-size: 20px;

    font-weight: 800;

    font-style: italic;

    color:
        #e8a05b;

    border:
        1px solid
        rgba(222,148,74,.68);

    background:

        linear-gradient(
            145deg,
            rgba(190,110,45,.18),
            rgba(83,45,18,.22)
        );

    box-shadow:
        0 0 12px
        rgba(205,115,45,.14);

    text-shadow:
        0 0 9px
        rgba(225,135,65,.5);
}


/* =========================================================
   CORPO
========================================================= */

.id-body {

    display: flex;

    align-items: center;

    gap: 16px;

    position: relative;

    z-index: 2;
}


/* =========================================================
   FOTO
========================================================= */

.photo-frame {

    position: relative;

    width: 112px;

    height: 112px;

    flex-shrink: 0;

    padding: 4px;

    border-radius: 50%;

    border:
        1px solid
        rgba(125,235,255,.48);

    background:
        rgba(0,20,35,.75);

    box-shadow:
        0 0 18px
        rgba(0,210,255,.12);

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}


.photo-frame:active {

    transform:
        scale(.95);

    box-shadow:
        0 0 26px
        rgba(0,220,255,.28);
}


.photo-frame::after {

    content: "TOCCA";

    position: absolute;

    left: 50%;

    bottom: -17px;

    transform:
        translateX(-50%);

    padding:
        3px 6px;

    border-radius:
        999px;

    border:
        1px solid
        rgba(100,235,255,.18);

    background:
        rgba(0,15,28,.72);

    font-size: 4px;

    letter-spacing: 1px;

    color:
        rgba(205,250,255,.62);
}


.photo-frame img,
.photo-placeholder {

    width: 100%;

    height: 100%;

    border-radius: 50%;
}


.photo-frame img {

    display: block;

    object-fit: cover;
}


.photo-placeholder {

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: 6px;

    color:
        rgba(150,225,245,.35);
}


/* =========================================================
   IDENTITÀ
========================================================= */

.identity-info {

    flex: 1;

    min-width: 0;
}


.identity-label {

    font-size: 5.5px;

    letter-spacing: 1.5px;

    color:
        rgba(150,225,240,.48);

    margin-bottom: 4px;
}


.identity-name {

    font-size: 20px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: 1.5px;

    margin-bottom: 14px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    text-shadow:
        0 0 12px
        rgba(0,220,255,.4);
}


.identity-deck {

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 1.5px;

    margin-bottom: 13px;

    color:
        rgba(220,250,255,.9);
}


.id-row {

    display: flex;

    justify-content: space-between;

    padding:
        6px 0;

    border-bottom:
        1px solid
        rgba(120,220,240,.08);
}


.id-row-label {

    font-size: 5.5px;

    letter-spacing: 1px;

    color:
        rgba(155,225,240,.5);
}


.id-row-value {

    font-size: 7px;

    font-weight: 700;
}


.id-footer {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 18px;

    padding-top: 9px;

    border-top:
        1px solid
        rgba(120,220,240,.12);

    position: relative;

    z-index: 2;
}


.id-status {

    display: flex;

    align-items: center;

    gap: 5px;

    font-size: 5px;

    letter-spacing: 1.5px;

    color:
        rgba(150,235,250,.5);
}


.status-dot {

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background:
        #55f5ff;

    box-shadow:
        0 0 7px
        #00eaff;
}


.id-number {

    font-size: 5px;

    letter-spacing: 1px;

    color:
        rgba(140,220,240,.35);
}


/* =========================================================
   STATISTICHE
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    margin-top: 10px;
}


.stat {

    min-height: 83px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        10px 5px;

    border-radius: 15px;

    border:
        1px solid
        rgba(135,235,255,.18);

    background:

        linear-gradient(
            145deg,
            rgba(19,71,98,.4),
            rgba(4,27,48,.55)
        );
}


.stat-label {

    font-size: 5.5px;

    letter-spacing: 1px;

    color:
        rgba(180,235,250,.55);

    margin-bottom: 7px;
}


.stat-value {

    font-size: 17px;

    font-weight: 700;

    text-shadow:
        0 0 9px
        rgba(0,220,255,.35);
}


/* =========================================================
   DECK NEURON
========================================================= */

.neuron-card {

    display: flex;

    align-items: center;

    gap: 12px;

    width: 100%;

    min-height: 82px;

    margin-top: 10px;

    padding:
        13px 14px;

    border-radius: 17px;

    border:
        1px solid
        rgba(135,235,255,.22);

    background:

        linear-gradient(
            135deg,
            rgba(18,72,98,.44),
            rgba(4,27,48,.60)
        );

    color: white;

    text-decoration: none;

    transition:
        .18s;
}


.neuron-card:active {

    transform:
        scale(.975);
}


.neuron-card.disabled {

    opacity: .45;

    pointer-events: none;
}


.neuron-icon {

    width: 38px;

    height: 38px;

    flex-shrink: 0;

    color:
        #8ceeff;
}


.neuron-icon svg {

    width: 100%;

    height: 100%;

    fill: none;

    stroke:
        currentColor;

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.neuron-info {

    flex: 1;
}


.neuron-label {

    font-size: 5px;

    letter-spacing: 1.4px;

    color:
        rgba(150,225,240,.45);

    margin-bottom: 5px;
}


.neuron-title {

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1.2px;
}


.neuron-sub {

    margin-top: 5px;

    font-size: 5.5px;

    letter-spacing: 1px;

    color:
        rgba(180,235,250,.55);
}


.neuron-arrow {

    font:
        24px Arial;

    color:
        rgba(150,235,255,.55);
}


/* =========================================================
   STORICO
========================================================= */

.history {

    margin-top: 22px;
}


.history-list {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.duel-item {

    display: flex;

    align-items: center;

    gap: 10px;

    min-height: 72px;

    padding:
        10px 12px;

    border-radius: 15px;

    border:
        1px solid
        rgba(135,235,255,.17);

    background:

        linear-gradient(
            135deg,
            rgba(14,55,78,.45),
            rgba(3,25,43,.6)
        );
}


.duel-number {

    width: 35px;

    height: 35px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    border:
        1px solid
        rgba(120,225,245,.2);

    background:
        rgba(0,30,48,.55);

    font-size: 9px;

    font-weight: 700;

    color:
        rgba(170,240,255,.75);
}


.duel-info {

    flex: 1;

    min-width: 0;
}


.duel-label {

    font-size: 5px;

    letter-spacing: 1.3px;

    color:
        rgba(150,225,240,.45);

    margin-bottom: 5px;
}


.duel-opponent {

    font-size: 9px;

    font-weight: 700;
}


.duel-result {

    min-width: 62px;

    text-align: right;

    font-size: 7px;

    font-weight: 700;
}


.win {
    color: #6effc2;
}

.draw {
    color: #ffe878;
}

.loss {
    color: #ff7085;
}

.pending {
    color: rgba(170,230,245,.45);
}


.loading,
.error {

    text-align: center;

    padding:
        25px 10px;

    font-size: 7px;

    letter-spacing: 1.5px;
}


.loading {
    color: rgba(150,225,245,.45);
}


.error {
    color: rgba(255,110,130,.75);
}


/* =========================================================
   MODAL FOTO
========================================================= */

.photo-modal {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,215,255,.13),
            transparent 35%
        ),

        rgba(0,6,14,.93);

    backdrop-filter:
        blur(12px);

    overflow: hidden;
}


.photo-modal.open {
    display: flex;
}


.photo-modal-close {

    position: absolute;

    right: 18px;

    top:
        max(
            18px,
            env(safe-area-inset-top)
        );

    z-index: 20;

    width: 40px;

    height: 40px;

    border-radius: 50%;

    border:
        1px solid
        rgba(120,235,255,.3);

    background:
        rgba(4,30,50,.75);

    color: white;

    font:
        23px Arial;
}


.photo-stage {

    position: relative;

    width:
        min(92vw,460px);

    height:
        min(78vh,620px);

    display: flex;

    align-items: center;

    justify-content: center;
}


.photo-ring {

    position: absolute;

    width:
        min(80vw,390px);

    aspect-ratio: 1;

    border-radius: 50%;

    border:
        1px solid
        rgba(90,235,255,.24);

    animation:
        spin 12s linear infinite;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


.photo-image-wrap {

    position: relative;

    z-index: 5;

    width:
        min(72vw,330px);

    height:
        min(72vw,330px);

    padding: 5px;

    border-radius: 50%;

    border:
        1px solid
        rgba(105,240,255,.56);

    background:
        rgba(0,18,32,.82);

    box-shadow:
        0 0 28px
        rgba(0,220,255,.18);

    overflow: hidden;

    animation:
        zoomIn .48s ease both;
}


@keyframes zoomIn {

    from {

        opacity: 0;

        transform:
            scale(.25);

    }

    70% {

        opacity: 1;

        transform:
            scale(1.05);

    }

    to {

        transform:
            scale(1);

    }

}


.photo-image {

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 50%;
}


.photo-name {

    position: absolute;

    left: 50%;

    bottom: 3%;

    transform:
        translateX(-50%);

    z-index: 12;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 3px;

    text-shadow:
        0 0 15px
        #6ee7ff;
}


/* =========================================================
   OLOGRAMMA GUANTONI
========================================================= */

.holo-fx {

    position: absolute;

    z-index: 8;

    width:
        min(92vw,460px);

    height:
        min(76vh,570px);

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    pointer-events: none;

    color:
        #74efff;

    opacity: 1;

    visibility: visible;

    transition:
        opacity .82s ease,
        filter .82s ease;
}


.holo-fx.fade {

    opacity:
        0 !important;

    filter:
        blur(5px) !important;
}


.holo-fx svg {

    width: 100%;

    height: 100%;

    filter:

        drop-shadow(
            0 0 8px
            rgba(50,225,255,.75)
        )

        drop-shadow(
            0 0 18px
            rgba(0,135,255,.3)
        );
}


.holo-stroke {

    fill:
        rgba(25,205,255,.055);

    stroke:
        currentColor;

    stroke-width: 3;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.holo-thin {

    fill: none;

    stroke:
        currentColor;

    stroke-width: 2;

    stroke-linecap: round;
}


.holo-fill {

    fill:
        rgba(80,235,255,.18);

    stroke:
        currentColor;

    stroke-width: 2;
}


.glove-left {

    animation:
        punchLeft
        .75s
        cubic-bezier(.2,.8,.2,1)
        both;
}


.glove-right {

    animation:
        punchRight
        .75s
        .14s
        cubic-bezier(.2,.8,.2,1)
        both;
}


.impact {

    transform-origin:
        250px 300px;

    animation:
        impact
        .5s
        .43s
        ease
        both;
}


@keyframes punchLeft {

    from {

        transform:
            translateX(-210px)
            rotate(-25deg);

        opacity: 0;

    }

    70% {

        transform:
            translateX(28px)
            rotate(8deg);

        opacity: 1;

    }

    to {
        transform: none;
    }

}


@keyframes punchRight {

    from {

        transform:
            translateX(210px)
            rotate(25deg);

        opacity: 0;

    }

    70% {

        transform:
            translateX(-28px)
            rotate(-8deg);

        opacity: 1;

    }

    to {
        transform: none;
    }

}


@keyframes impact {

    from {

        opacity: 0;

        transform:
            scale(.1);

    }

    55% {

        opacity: 1;

        transform:
            scale(1.7);

    }

    to {

        opacity: .3;

        transform:
            scale(1);

    }

}


.footer {

    text-align: center;

    margin-top: 25px;

    font:
        7px Arial;

    letter-spacing: 1.5px;

    color:
        rgba(160,220,235,.2);
}


@media(max-width:360px) {

    .page {

        padding:
            14px 10px 25px;

    }


    .photo-frame {

        width: 96px;

        height: 96px;

    }


    .identity-name {

        font-size: 17px;

    }

}

</style>

</head>


<body>


<div class="page">


<header class="header">


<a
    id="backButton"
    href="index-ale.html"
    class="back"
    aria-label="Torna alla Home di Ale">

    ‹

</a>


<div class="brand">

    <div class="brand-main">
        ALIS
    </div>

    <div class="brand-sub">
        DUELIST PROFILE
    </div>

</div>


<div class="header-space"></div>


</header>



<div class="section-header">

    <div class="section-line"></div>

    <div class="section-title">
        DUELIST ID
    </div>

    <div class="section-line right"></div>

</div>



<div class="id-card">


<div class="id-top">


<div class="id-title">
    ALIS DUELIST SYSTEM
</div>


<div class="id-top-right">


<div class="id-code">
    ID CARD
</div>


<div class="rank-badge">
    B
</div>


</div>


</div>



<div class="id-body">


<div
    id="photoFrame"
    class="photo-frame"
    role="button"
    tabindex="0">


<img
    id="profilePhoto"
    src=""
    alt="Ale"
    style="display:none;">


<div
    id="photoPlaceholder"
    class="photo-placeholder">

    PHOTO<br>
    NOT FOUND

</div>


</div>



<div class="identity-info">


<div class="identity-label">
    NOME DUELLANTE
</div>


<div
    id="duelistName"
    class="identity-name">

    ALE

</div>


<div class="identity-label">
    DECK
</div>


<div
    id="duelistDeck"
    class="identity-deck">

    DECK

</div>



<div class="id-row">

<span class="id-row-label">
    POSIZIONE
</span>

/* =========================================================
   FETCH
========================================================= */

async function supabaseFetch(path) {


    const response =
        await fetch(

            SUPABASE_URL +
            path,

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                },

                cache:
                    "no-store"

            }

        );


    if (!response.ok) {

        throw new Error(
            await response.text()
        );

    }


    return response.json();

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text) {


    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

/* =========================================================
   STATISTICHE
========================================================= */

function calculateStats(duels) {


    let wins =
        0;


    let draws =
        0;


    let losses =
        0;


    let lp =
        0;


    let played =
        0;


    duels.forEach(

        function(duel) {


            const isA =

                duel.duellante_a ===
                ALE_ID;


            const myLP =

                isA

                    ? duel["LP_a"]

                    : duel["LP_b"];


            const enemyLP =

                isA

                    ? duel["LP_b"]

                    : duel["LP_a"];


            if (
                myLP != null
            ) {


                lp +=
                    Number(
                        myLP
                    );

            }


            if (
                myLP != null &&
                enemyLP != null
            ) {


                played++;


                if (
                    Number(myLP) >
                    Number(enemyLP)
                ) {


                    wins++;

                }


                else if (
                    Number(myLP) <
                    Number(enemyLP)
                ) {


                    losses++;

                }


                else {


                    draws++;

                }

            }

        }

    );


    document.getElementById(
        "recordValue"
    ).textContent =

        wins +
        "-" +
        draws +
        "-" +
        losses;


    document.getElementById(
        "lpValue"
    ).textContent =

        lp;


    document.getElementById(
        "duelsValue"
    ).textContent =

        played;

}

async function buildHistory(duels) {

    let counter =
        0;


    for (
        const duel of duels

        const isA =

            duel.duellante_a ===
            ALE_ID;


        const opponentId =

            isA

                ? duel.duellante_b

                : duel.duellante_a;


        const myLP =

            isA

                ? duel["LP_a"]

                : duel["LP_b"];


        const enemyLP =

            isA

                ? duel["LP_b"]

                : duel["LP_a"];


        let opponentName =
            "AVVERSARIO";


        try {


            const opponent =
                await supabaseFetch(

                    "/rest/v1/duellanti" +

                    "?select=nome" +

                    "&id=eq." +
                    encodeURIComponent(
                        opponentId
                    ) +

                    "&limit=1"

                );


            opponentName =

                opponent?.[0]?.nome ||

                opponentName;


        }

        catch(error) {


            console.error(
                error
            );

        }


        let result =
            "IN PROGRAMMA";


        let css =
            "pending";


        if (
            myLP != null &&
            enemyLP != null
        ) {


            counter++;


            if (
                Number(myLP) >
                Number(enemyLP)
            ) {


                result =
                    "VITTORIA";


                css =
                    "win";

            }


            else if (
                Number(myLP) <
                Number(enemyLP)
            ) {


                result =
                    "SCONFITTA";


                css =
                    "loss";

            }


            else {


                result =
                    "PAREGGIO";


                css =
                    "draw";

            }

        }


        const number =

            counter ||

            (
                duels.indexOf(
                    duel
                ) +
                1
            );


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "duel-item";


        item.innerHTML = `

            <div class="duel-number">

                ${number}

            </div>


            <div class="duel-info">


                <div class="duel-label">

                    DUELLO ${number}

                </div>


                <div class="duel-opponent">

                    ${escapeHTML(
                        opponentName
                    )}

                </div>


            </div>


            <div class="duel-result ${css}">

                ${result}

            </div>

        `;


        list.appendChild(
            item
        );

    }

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext =
    null;


function getAudioContext() {


    if (
        !audioContext
    ) {


        const AudioContextClass =

            window.AudioContext ||

            window.webkitAudioContext;


        if (
            !AudioContextClass
        ) {


            return null;

        }


        audioContext =
            new AudioContextClass();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {


        audioContext
            .resume()
            .catch(
                function(){}
            );

    }


    return audioContext;

}


function tone(
    frequency,
    duration,
    volume,
    type,
    delay = 0
) {


    const ctx =
        getAudioContext();


    if (
        !ctx
    ) {


        return;

    }


    const oscillator =
        ctx.createOscillator();


    const gain =
        ctx.createGain();


    oscillator.type =
        type;


    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(

        .0001,

        ctx.currentTime +
        delay

    );


    gain.gain.exponentialRampToValueAtTime(

        volume,

        ctx.currentTime +
        delay +
        .01

    );


    gain.gain.exponentialRampToValueAtTime(

        .0001,

        ctx.currentTime +
        delay +
        duration

    );


    oscillator
        .connect(
            gain
        )
        .connect(
            ctx.destination
        );


    oscillator.start(
        ctx.currentTime +
        delay
    );


    oscillator.stop(

        ctx.currentTime +
        delay +
        duration +
        .03

    );

}


function noise(
    duration,
    volume,
    delay
) {


    const ctx =
        getAudioContext();


    if (
        !ctx
    ) {


        return;

    }


    const buffer =
        ctx.createBuffer(

            1,

            Math.floor(
                ctx.sampleRate *
                duration
            ),

            ctx.sampleRate

        );


    const data =
        buffer.getChannelData(
            0
        );


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        data[i] =

            Math.random() *
            2 -
            1;

    }


    const source =
        ctx.createBufferSource();


    const gain =
        ctx.createGain();


    source.buffer =
        buffer;


    gain.gain.setValueAtTime(

        volume,

        ctx.currentTime +
        delay

    );


    gain.gain.exponentialRampToValueAtTime(

        .0001,

        ctx.currentTime +
        delay +
        duration

    );


    source
        .connect(
            gain
        )
        .connect(
            ctx.destination
        );


    source.start(
        ctx.currentTime +
        delay
    );

}
