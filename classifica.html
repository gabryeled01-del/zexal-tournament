<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
      content="no-cache">

<meta http-equiv="Expires"
      content="0">

<title>Classifica ZEXAL</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family: 'Orbitron', sans-serif;

    color: white;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(0,210,255,0.15),
            transparent 32%
        ),

        radial-gradient(
            circle at 0% 70%,
            rgba(0,100,255,0.08),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #020914 0%,
            #041322 50%,
            #020812 100%
        );

    overflow-x: hidden;
}


/* =========================================================
   GRIGLIA TECNOLOGICA
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: -80px;

    z-index: -2;

    background-image:

        linear-gradient(
            rgba(0,220,255,0.04) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,220,255,0.04) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    transform:
        perspective(600px)
        rotateX(58deg)
        scale(1.8)
        translateY(80px);

    transform-origin: center bottom;

    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {

    from {
        background-position: 0 0, 0 0;
    }

    to {
        background-position: 0 42px, 42px 0;
    }

}


/* =========================================================
   PAGINA
========================================================= */

.page {

    width: 100%;

    max-width: 560px;

    margin: 0 auto;

    padding:
        18px 14px 30px;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.back {

    width: 35px;
    height: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(125,235,255,0.25);

    background:
        rgba(4,30,50,0.6);

    color: white;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 23px;
}


.brand {

    flex: 1;

    text-align: center;
}


.brand-main {

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 2.2px;

    text-shadow:
        0 0 10px
        rgba(0,220,255,0.55);
}


.brand-sub {

    margin-top: 4px;

    font-size: 6px;

    letter-spacing: 2px;

    color:
        rgba(175,235,255,0.5);
}


.header-space {

    width: 35px;
}


/* =========================================================
   TITOLO
========================================================= */

.title-row {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 14px;
}


.line {

    flex: 1;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,220,255,0.5)
        );
}


.line.right {

    background:
        linear-gradient(
            90deg,
            rgba(0,220,255,0.5),
            transparent
        );
}


.title {

    font-size: 8px;

    font-weight: 700;

    letter-spacing: 2px;

    white-space: nowrap;
}


/* =========================================================
   SELETTORE GIRONI
========================================================= */

.rounds {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 6px;

    margin-bottom: 10px;
}


.round-btn {

    border:
        1px solid
        rgba(125,235,255,0.2);

    border-radius: 10px;

    padding: 10px 2px;

    background:
        rgba(4,30,50,0.55);

    color:
        rgba(175,230,245,0.5);

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 5.5px;

    font-weight: 600;

    letter-spacing: 0.5px;

    cursor: pointer;
}


.round-btn.active {

    color: white;

    border-color:
        rgba(82,235,255,0.6);

    background:
        rgba(0,110,145,0.35);

    box-shadow:
        0 0 14px
        rgba(0,215,255,0.12);
}


.round-btn:active {

    transform: scale(0.96);
}


.current-round {

    text-align: center;

    margin:
        4px 0 15px;

    font-size: 6px;

    letter-spacing: 1.5px;

    color:
        rgba(150,225,245,0.42);
}


/* =========================================================
   PODIO
========================================================= */

.podium {

    display: grid;

    grid-template-columns:
        1fr 1.15fr 1fr;

    align-items: end;

    gap: 7px;

    margin-bottom: 18px;
}


.podium-card {

    min-height: 100px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 8px 5px;

    text-align: center;

    border-radius: 16px;

    border:
        1px solid
        rgba(135,235,255,0.2);

    background:

        linear-gradient(
            145deg,
            rgba(19,71,98,0.45),
            rgba(4,27,48,0.65)
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.05);
}


.podium-card.first {

    min-height: 120px;

    border-color:
        rgba(98,239,255,0.4);

    box-shadow:

        0 0 22px
        rgba(0,220,255,0.1),

        inset 0 1px 0
        rgba(255,255,255,0.07);
}


.podium-position {

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 8px;

    text-shadow:
        0 0 10px
        rgba(0,220,255,0.45);
}


.podium-name {

    max-width: 100%;

    font-size: 8px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.podium-points {

    margin-top: 6px;

    font-size: 5.5px;

    letter-spacing: 1px;

    color:
        rgba(170,235,250,0.55);
}


/* =========================================================
   LISTA
========================================================= */

.ranking {

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.player {

    display: flex;

    align-items: center;

    gap: 8px;

    min-height: 68px;

    padding: 9px 10px;

    border-radius: 15px;

    border:
        1px solid
        rgba(135,235,255,0.17);

    background:

        linear-gradient(
            135deg,
            rgba(14,55,78,0.46),
            rgba(3,25,43,0.62)
        );

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.035),

        0 7px 18px
        rgba(0,0,0,0.16);
}


/* =========================================================
   EVIDENZIA DUELLANTE ATTIVO
========================================================= */

.player.me {

    border-color:
        rgba(82,235,255,0.5);

    background:

        linear-gradient(
            135deg,
            rgba(18,77,103,0.62),
            rgba(3,31,51,0.72)
        );

    box-shadow:

        0 0 18px
        rgba(0,215,255,0.08),

        inset 0 1px 0
        rgba(255,255,255,0.07);
}


/* =========================================================
   POSIZIONE
========================================================= */

.rank {

    width: 31px;
    height: 31px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    border:
        1px solid
        rgba(120,225,245,0.18);

    background:
        rgba(0,30,48,0.55);

    font-size: 8px;

    font-weight: 700;
}


/* =========================================================
   INFO
========================================================= */

.player-info {

    flex: 1;

    min-width: 0;
}


.player-name {

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 0.7px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.player-deck {

    margin-top: 5px;

    font-size: 5px;

    letter-spacing: 1px;

    color:
        rgba(155,225,240,0.45);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   RECORD
========================================================= */

.record {

    width: 48px;

    flex-shrink: 0;

    text-align: center;
}


.record-label {

    font-size: 4px;

    letter-spacing: 0.7px;

    color:
        rgba(155,225,240,0.4);

    margin-bottom: 4px;
}


.record-value {

    font-size: 7px;

    font-weight: 700;
}


/* =========================================================
   PUNTI
========================================================= */

.points {

    width: 42px;

    flex-shrink: 0;

    text-align: right;
}


.points-value {

    font-size: 13px;

    font-weight: 700;

    text-shadow:
        0 0 8px
        rgba(0,220,255,0.35);
}


.points-label {

    margin-top: 3px;

    font-size: 4px;

    letter-spacing: 0.7px;

    color:
        rgba(155,225,240,0.4);
}


/* =========================================================
   STATI
========================================================= */

.loading {

    width: 100%;

    padding: 30px 10px;

    text-align: center;

    font-size: 7px;

    letter-spacing: 1.4px;

    color:
        rgba(150,225,245,0.45);
}


.error {

    width: 100%;

    padding: 25px 10px;

    text-align: center;

    font-size: 7px;

    line-height: 1.8;

    letter-spacing: 0.8px;

    color:
        rgba(255,110,130,0.75);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 25px;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 7px;

    letter-spacing: 1.5px;

    color:
        rgba(160,220,235,0.2);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 360px) {

    .page {

        padding:
            14px 10px 25px;
    }

    .player {

        gap: 5px;

        padding: 8px;
    }

    .rank {

        width: 28px;
        height: 28px;

        font-size: 7px;
    }

    .player-name {

        font-size: 8px;
    }

    .player-deck {

        font-size: 4.5px;
    }

    .record {

        width: 42px;
    }

    .points {

        width: 38px;
    }

    .points-value {

        font-size: 12px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <a
        href="#"
        class="back"
        onclick="goBack(); return false;">

        ‹

    </a>


    <div class="brand">

        <div class="brand-main">
            ZEXAL
        </div>

        <div class="brand-sub">
            TOURNAMENT
        </div>

    </div>


    <div class="header-space"></div>

</header>



<!-- =====================================================
     TITOLO
===================================================== -->

<div class="title-row">

    <div class="line"></div>

    <div class="title">
        CLASSIFICA ZEXAL
    </div>

    <div class="line right"></div>

</div>



<!-- =====================================================
     GIRONI
===================================================== -->

<div class="rounds">


    <button
        class="round-btn active"
        data-round="1"
        onclick="changeRound(1)">

        GIRONE 1

    </button>


    <button
        class="round-btn"
        data-round="2"
        onclick="changeRound(2)">

        GIRONE 2

    </button>


    <button
        class="round-btn"
        data-round="3"
        onclick="changeRound(3)">

        GIRONE 3

    </button>


    <button
        class="round-btn"
        data-round="4"
        onclick="changeRound(4)">

        GIRONE 4

    </button>


</div>


<div
    id="currentRound"
    class="current-round">

    CLASSIFICA GIRONE 1

</div>



<!-- =====================================================
     PODIO
===================================================== -->

<div
    id="podium"
    class="podium">

    <div class="loading">

        CARICAMENTO...

    </div>

</div>



<!-- =====================================================
     RANKING
===================================================== -->

<div class="title-row">

    <div class="line"></div>

    <div class="title">
        RANKING
    </div>

    <div class="line right"></div>

</div>


<div
    id="ranking"
    class="ranking">

    <div class="loading">

        CARICAMENTO CLASSIFICA...

    </div>

</div>


<div class="footer">

    ZEXAL • TOURNAMENT

</div>


</div>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://swbrwezlygmtsuudwlfg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_uV3FT9S9f6dajA4NRgofFA_cGOCvTNG";



/* =========================================================
   DUELLANTE ATTIVO
========================================================= */

function normalizePlayerName(name) {


    const value =

        String(name || "")

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim()

        .toUpperCase();



    const aliases = {


        GABRIELE:
            "GABRY",


        ALESSANDRO:
            "ALE",


        CHRISTIAN:
            "CHRY",


        CHRIS:
            "CHRY",


        FRANCESCO:
            "FRA",


        MANUEL:
            "MANU",


        MANUELE:
            "MANU",


        GIOVANNI:
            "GIO"


    };


    return (

        aliases[value] ||

        value

    );

}



/* =========================================================
   LEGGE ?nome=
========================================================= */

const pageParams =

    new URLSearchParams(
        window.location.search
    );



const ACTIVE_PLAYER =

    normalizePlayerName(

        pageParams.get(
            "nome"
        )

        ||

        sessionStorage.getItem(
            "ALIS_ACTIVE_PLAYER"
        )

        ||

        "GABRY"

    );



sessionStorage.setItem(

    "ALIS_ACTIVE_PLAYER",

    ACTIVE_PLAYER

);



/* =========================================================
   TORNA ALLA HOME GIUSTA
========================================================= */

function goBack() {


    window.location.href =

        "index.html?nome=" +

        encodeURIComponent(
            ACTIVE_PLAYER
        );

}



/* =========================================================
   GIRONE ATTUALE
========================================================= */

let currentRound =
    1;



/* =========================================================
   RICHIESTA SUPABASE
========================================================= */

async function supabaseFetch(path) {


    const response =

        await fetch(

            SUPABASE_URL +
            path,

            {

                method:
                    "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                },

                cache:
                    "no-store"

            }

        );


    if (
        !response.ok
    ) {


        const text =
            await response.text();


        throw new Error(
            text
        );

    }


    return await response.json();

}



/* =========================================================
   SICUREZZA TESTO
========================================================= */

function escapeHTML(value) {


    return String(
        value ??
        ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   CAMBIO GIRONE
========================================================= */

function changeRound(round) {


    currentRound =
        Number(
            round
        );


    document
    .querySelectorAll(
        ".round-btn"
    )
    .forEach(

        function(button) {


            button.classList.toggle(

                "active",

                Number(
                    button.dataset.round
                )

                ===

                currentRound

            );


        }

    );


    document.getElementById(
        "currentRound"
    ).textContent =

        "CLASSIFICA GIRONE " +

        currentRound;


    loadRanking();

}



/* =========================================================
   CARICAMENTO CLASSIFICA
========================================================= */

async function loadRanking() {


    const ranking =

        document.getElementById(
            "ranking"
        );


    const podium =

        document.getElementById(
            "podium"
        );



    ranking.innerHTML =

        '<div class="loading">' +

        'CARICAMENTO...' +

        '</div>';



    podium.innerHTML =

        '<div class="loading">' +

        'CARICAMENTO...' +

        '</div>';



    try {


        /* ==============================================
           CARICA DUELLANTI
        ============================================== */

        const players =

            await supabaseFetch(

                "/rest/v1/duellanti?select=*"

            );



        if (
            !Array.isArray(
                players
            )
        ) {


            throw new Error(

                "Risposta duellanti non valida"

            );

        }



        /* ==============================================
           CARICA DUELLI DEL GIRONE
        ============================================== */

        const duels =

            await supabaseFetch(

                "/rest/v1/duelli" +

                "?select=*" +

                "&girone=eq." +

                currentRound

            );



        if (
            !Array.isArray(
                duels
            )
        ) {


            throw new Error(

                "Risposta duelli non valida"

            );

        }



        /* ==============================================
           CREA STATISTICHE
        ============================================== */

        const stats = {};


        players.forEach(

            function(player) {


                stats[
                    player.id
                ] = {


                    points:
                        0,


                    wins:
                        0,


                    draws:
                        0,


                    losses:
                        0,


                    bonus:
                        0


                };


            }

        );



        /* ==============================================
           ANALIZZA DUELLI
        ============================================== */

        duels.forEach(

            function(duel) {


                const A =

                    stats[
                        duel.duellante_a
                    ];


                const B =

                    stats[
                        duel.duellante_b
                    ];



                if (
                    !A ||
                    !B
                ) {

                    return;

                }



                const lpA =
                    duel.LP_a;


                const lpB =
                    duel.LP_b;



                /* DUELLO NON GIOCATO */

                if (

                    lpA === null ||

                    lpA === undefined ||

                    lpB === null ||

                    lpB === undefined ||

                    lpA === "" ||

                    lpB === ""

                ) {

                    return;

                }



                const scoreA =
                    Number(
                        lpA
                    );


                const scoreB =
                    Number(
                        lpB
                    );



                if (

                    !Number.isFinite(
                        scoreA
                    )

                    ||

                    !Number.isFinite(
                        scoreB
                    )

                ) {

                    return;

                }



                /* VITTORIA A */

                if (
                    scoreA >
                    scoreB
                ) {


                    A.wins++;


                    A.points +=
                        3;


                    B.losses++;

                }



                /* VITTORIA B */

                else if (
                    scoreB >
                    scoreA
                ) {


                    B.wins++;


                    B.points +=
                        3;


                    A.losses++;

                }



                /* PAREGGIO */

                else {


                    A.draws++;


                    B.draws++;


                    A.points +=
                        1;


                    B.points +=
                        1;

                }


            }

        );



        /* ==============================================
           BONUS MANUALI
        ============================================== */

        duels.forEach(

            function(duel) {


                const A =

                    stats[
                        duel.duellante_a
                    ];


                const B =

                    stats[
                        duel.duellante_b
                    ];



                if (
                    !A ||
                    !B
                ) {

                    return;

                }



                const bonusA =

                    Number(

                        duel.bonus_a ??

                        0

                    );



                const bonusB =

                    Number(

                        duel.bonus_b ??

                        0

                    );



                if (
                    Number.isFinite(
                        bonusA
                    )
                ) {


                    A.points +=
                        bonusA;


                    A.bonus +=
                        bonusA;

                }



                if (
                    Number.isFinite(
                        bonusB
                    )
                ) {


                    B.points +=
                        bonusB;


                    B.bonus +=
                        bonusB;

                }


            }

        );



        /* ==============================================
           ORDINA CLASSIFICA
        ============================================== */

        players.sort(

            function(a, b) {


                const pointsA =

                    stats[
                        a.id
                    ].points;


                const pointsB =

                    stats[
                        b.id
                    ].points;



                if (
                    pointsA !==
                    pointsB
                ) {


                    return (

                        pointsB -

                        pointsA

                    );

                }



                /* A PARITÀ: PIÙ VITTORIE */

                const winsA =

                    stats[
                        a.id
                    ].wins;


                const winsB =

                    stats[
                        b.id
                    ].wins;



                if (
                    winsA !==
                    winsB
                ) {


                    return (

                        winsB -

                        winsA

                    );

                }



                /* PARITÀ: ALFABETICO */

                return String(

                    a.nome ??

                    ""

                ).localeCompare(

                    String(

                        b.nome ??

                        ""

                    )

                );


            }

        );



        /* ==============================================
           POSIZIONI
        ============================================== */

        players.forEach(

            function(
                player,
                index
            ) {


                player._position =

                    index +
                    1;


            }

        );



        /* ==============================================
           PODIO
        ============================================== */

        podium.innerHTML =
            "";


        const top =

            players.slice(
                0,
                3
            );



        if (
            top.length ===
            0
        ) {


            podium.innerHTML =

                '<div class="loading">' +

                'NESSUN DUELLANTE' +

                '</div>';

        }


        else {


            /* ORDINE VISIVO 2 - 1 - 3 */

            const podiumOrder =
                [];


            if (
                top[1]
            ) {

                podiumOrder.push(
                    top[1]
                );

            }


            if (
                top[0]
            ) {

                podiumOrder.push(
                    top[0]
                );

            }


            if (
                top[2]
            ) {

                podiumOrder.push(
                    top[2]
                );

            }



            podiumOrder.forEach(

                function(player) {


                    const card =

                        document.createElement(
                            "div"
                        );


                    card.className =
                        "podium-card";



                    if (
                        player._position ===
                        1
                    ) {


                        card.classList.add(
                            "first"
                        );

                    }



                    card.innerHTML = `

                        <div class="podium-position">

                            ${player._position}°

                        </div>


                        <div class="podium-name">

                            ${escapeHTML(
                                player.nome
                            )}

                        </div>


                        <div class="podium-points">

                            ${stats[player.id].points}
                            PUNTI

                        </div>

                    `;



                    podium.appendChild(
                        card
                    );


                }

            );

        }



        /* ==============================================
           LISTA COMPLETA
        ============================================== */

        ranking.innerHTML =
            "";



        players.forEach(

            function(player) {


                const stat =

                    stats[
                        player.id
                    ];



                const item =

                    document.createElement(
                        "div"
                    );


                item.className =
                    "player";



                /* =========================================
                   EVIDENZIA IL DUELLANTE DEL QR

                   ALE -> Ale/Alessandro
                   GABRY -> Gabry/Gabriele
                ========================================= */

                if (

                    normalizePlayerName(
                        player.nome
                    )

                    ===

                    ACTIVE_PLAYER

                ) {


                    item.classList.add(
                        "me"
                    );

                }



                item.innerHTML = `

                    <div class="rank">

                        ${player._position}°

                    </div>


                    <div class="player-info">

                        <div class="player-name">

                            ${escapeHTML(
                                player.nome
                            )}

                        </div>


                        <div class="player-deck">

                            ${escapeHTML(

                                player.deck ??

                                "DECK NON SPECIFICATO"

                            )}

                        </div>

                    </div>


                    <div class="record">

                        <div class="record-label">

                            V-P-S

                        </div>


                        <div class="record-value">

                            ${stat.wins}-
                            ${stat.draws}-
                            ${stat.losses}

                        </div>

                    </div>


                    <div class="points">

                        <div class="points-value">

                            ${stat.points}

                        </div>


                        <div class="points-label">

                            PUNTI

                        </div>

                    </div>

                `;



                ranking.appendChild(
                    item
                );


            }

        );


    }


    catch(error) {


        console.error(

            "ERRORE CLASSIFICA:",

            error

        );



        podium.innerHTML =

            '<div class="error">' +

            'ERRORE NEL CARICAMENTO' +

            '</div>';



        ranking.innerHTML =

            '<div class="error">' +

            'Non riesco a leggere i dati ' +

            'del Girone ' +

            currentRound +

            '<br><br>' +

            'Controlla la console del browser ' +

            'se il problema continua.' +

            '</div>';

    }

}



/* =========================================================
   AVVIO
========================================================= */

loadRanking();



/* =========================================================
   AGGIORNAMENTO AUTOMATICO
========================================================= */

setInterval(

    loadRanking,

    30000

);

</script>


</body>

</html>
