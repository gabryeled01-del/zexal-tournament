/* =========================================
   FETCH SUPABASE
========================================= */

async function supabaseFetch(path) {

    const response = await fetch(

        SUPABASE_URL + path,

        {
            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

            }
        }

    );


    if (!response.ok) {

        const text =
            await response.text();

        throw new Error(
            "Supabase " +
            response.status +
            ": " +
            text
        );

    }


    return await response.json();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================================
   LP VALIDO
========================================= */

function validLP(value) {

    return (

        value !== null &&

        value !== undefined &&

        value !== "" &&

        !Number.isNaN(
            Number(value)
        )

    );

}

        /* =================================
           ORDINA SUBITO I DUELLI

        ================================= */

        duels.sort(

                return (

                    Number(
                        a.numero_duello ??
                        999999
                    )

                    -

                    Number(
                        b.numero_duello ??

                    )

        );

           TROVA IL PROSSIMO DUELLO

        ) {

        "block";


    const placeholder =
        document.getElementById(
            "photoPlaceholder"
        );


    if (placeholder) {

        placeholder.style.display =
            "none";

    }

function hidePhoto() {

    const image =
        document.getElementById(
            "opponentPhoto"
        );


    if (image) {
