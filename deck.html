<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Duellanti — ALIS Duelist System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:'Orbitron',sans-serif;
    color:#fff;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,213,255,.15),
            transparent 32%
        ),
        radial-gradient(
            circle at 0 65%,
            rgba(0,112,255,.08),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #020914,
            #041322 50%,
            #020812
        );
}

body:before{

    content:"";

    position:fixed;

    inset:-80px;

    z-index:-3;

    background-image:

        linear-gradient(
            rgba(0,220,255,.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,220,255,.045) 1px,
            transparent 1px
        );

    background-size:
        42px 42px;

    transform:
        perspective(600px)
        rotateX(58deg)
        scale(1.8)
        translateY(80px);

    transform-origin:
        center bottom;

    animation:
        gridMove 18s linear infinite;

    pointer-events:none;
}

body:after{

    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,.32)
        );

    pointer-events:none;
}

@keyframes gridMove{

    to{
        background-position:
            0 42px,
            42px 0;
    }

}


/* =========================================================
   PAGINA
========================================================= */

.page{

    width:100%;

    max-width:560px;

    margin:auto;

    padding:
        18px
        14px
        30px;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    margin-bottom:
        18px;
}

.back{

    width:
        34px;

    height:
        34px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:
        50%;

    border:
        1px solid
        rgba(125,235,255,.25);

    background:
        rgba(4,30,50,.55);

    color:#fff;

    text-decoration:none;

    font:
        22px Arial;
}

.back:active{

    transform:
        scale(.9);
}

.brand{

    flex:1;

    text-align:center;
}

.brand-main{

    font-size:
        14px;

    font-weight:
        700;

    letter-spacing:
        2.2px;

    text-shadow:
        0 0 8px
        rgba(0,220,255,.55);
}

.brand-sub{

    margin-top:
        4px;

    font-size:
        6px;

    letter-spacing:
        2.5px;

    color:
        rgba(175,235,255,.55);
}

.header-space{

    width:
        34px;
}


/* =========================================================
   TITOLO
========================================================= */

.section-header{

    display:flex;

    align-items:center;

    gap:
        10px;

    margin-bottom:
        10px;
}

.section-line{

    flex:1;

    height:
        1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,220,255,.45)
        );
}

.section-line.right{

    background:
        linear-gradient(
            90deg,
            rgba(0,220,255,.45),
            transparent
        );
}

.section-title{

    font-size:
        8px;

    letter-spacing:
        2px;

    font-weight:
        700;

    color:
        rgba(220,250,255,.9);
}

.intro{

    text-align:center;

    margin:
        0
        5px
        15px;

    font-size:
        6px;

    line-height:
        1.6;

    letter-spacing:
        1px;

    color:
        rgba(160,225,245,.45);
}


/* =========================================================
   LISTA
========================================================= */

.duelist-list{

    display:flex;

    flex-direction:
        column;

    gap:
        8px;
}


/* =========================================================
   CARD DUELLANTE
========================================================= */

.duelist-card{

    position:relative;

    display:flex;

    align-items:center;

    width:100%;

    min-height:
        78px;

    padding:
        11px
        12px;

    border-radius:
        17px;

    border:
        1px solid
        rgba(135,235,255,.22);

    background:
        linear-gradient(
            135deg,
            rgba(18,72,98,.44),
            rgba(4,27,48,.60)
        );

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.055),

        0 10px 25px
        rgba(0,0,0,.2);

    text-decoration:none;

    color:#fff;

    overflow:hidden;

    transition:
        .18s;
}

.duelist-card:before{

    content:"";

    position:absolute;

    top:0;

    left:15%;

    right:15%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(80,235,255,.65),
            transparent
        );
}

.duelist-card:active{

    transform:
        scale(.975);

    border-color:
        rgba(80,230,255,.5);
}


/* =========================================================
   NUMERO
========================================================= */

.duelist-number{

    width:
        35px;

    height:
        35px;

    flex:
        0 0 auto;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-right:
        10px;

    border-radius:
        10px;

    border:
        1px solid
        rgba(120,225,245,.2);

    background:
        rgba(0,30,48,.55);

    font-size:
        9px;

    font-weight:
        700;

    color:
        rgba(170,240,255,.75);
}


/* =========================================================
   INFO
========================================================= */

.duelist-info{

    flex:1;

    min-width:
        0;
}

.duelist-label{

    font-size:
        5px;

    letter-spacing:
        1.4px;

    color:
        rgba(150,225,240,.45);

    margin-bottom:
        5px;
}

.duelist-name{

    font-size:
        12px;

    font-weight:
        700;

    letter-spacing:
        1.1px;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    text-shadow:
        0 0 9px
        rgba(0,220,255,.35);
}

.duelist-deck{

    margin-top:
        5px;

    font-size:
        6px;

    letter-spacing:
        1.2px;

    color:
        rgba(205,245,255,.62);

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


/* =========================================================
   RANK
========================================================= */

.duelist-rank{

    width:
        38px;

    height:
        38px;

    flex:
        0 0 auto;

    margin-left:
        8px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:
        10px;

    font-size:
        19px;

    font-weight:
        800;

    font-style:
        italic;

    position:
        relative;
}

.duelist-rank:after{

    content:"";

    position:absolute;

    inset:
        3px;

    border-radius:
        7px;

    border:
        1px solid
        rgba(255,255,255,.1);
}


/* S = ORO */

.rank-s{

    color:
        #ffe27a;

    border:
        1px solid
        rgba(255,220,105,.72);

    background:
        linear-gradient(
            145deg,
            rgba(255,210,70,.2),
            rgba(110,75,5,.22)
        );

    box-shadow:
        0 0 13px
        rgba(255,205,60,.2);

    text-shadow:
        0 0 10px
        rgba(255,200,50,.65);
}


/* B = ARGENTO */

.rank-b{

    color:
        #e8f5ff;

    border:
        1px solid
        rgba(215,235,245,.68);

    background:
        linear-gradient(
            145deg,
            rgba(215,235,245,.16),
            rgba(80,105,120,.18)
        );

    box-shadow:
        0 0 12px
        rgba(190,225,245,.14);

    text-shadow:
        0 0 9px
        rgba(220,245,255,.5);
}


/* A = BRONZO */

.rank-a{

    color:
        #e8a05b;

    border:
        1px solid
        rgba(222,148,74,.68);

    background:
        linear-gradient(
            145deg,
            rgba(190,110,45,.18),
            rgba(83,45,18,.22)
        );

    box-shadow:
        0 0 12px
        rgba(205,115,45,.14);

    text-shadow:
        0 0 9px
        rgba(225,135,65,.5);
}


/* C = VERDE */

.rank-c{

    color:
        #72ffc0;

    border:
        1px solid
        rgba(95,255,170,.58);

    background:
        linear-gradient(
            145deg,
            rgba(30,180,100,.14),
            rgba(5,72,47,.22)
        );

    box-shadow:
        0 0 12px
        rgba(50,235,150,.14);

    text-shadow:
        0 0 9px
        rgba(70,255,170,.5);
}


/* =========================================================
   MINI STAT
========================================================= */

.duelist-stats{

    display:flex;

    flex-direction:
        column;

    align-items:
        flex-end;

    gap:
        4px;

    margin-left:
        8px;

    min-width:
        48px;
}

.mini-stat{

    display:flex;

    align-items:center;

    gap:
        4px;
}

.mini-label{

    font-size:
        4.5px;

    letter-spacing:
        .8px;

    color:
        rgba(150,225,240,.4);
}

.mini-value{

    font-size:
        7px;

    font-weight:
        700;

    color:
        rgba(235,250,255,.85);
}

.duelist-arrow{

    margin-left:
        8px;

    font:
        22px Arial;

    color:
        rgba(150,235,255,.55);
}


/* =========================================================
   MESSAGGI
========================================================= */

.loading,
.empty,
.error{

    text-align:center;

    padding:
        28px
        15px;

    border-radius:
        17px;

    font-size:
        7px;

    letter-spacing:
        1.4px;

    line-height:
        1.7;

    background:
        rgba(4,27,48,.42);
}

.loading,
.empty{

    border:
        1px solid
        rgba(135,235,255,.15);

    color:
        rgba(150,225,245,.45);
}

.error{

    border:
        1px solid
        rgba(255,110,130,.18);

    color:
        rgba(255,110,130,.7);
}

.loading-dot{

    width:
        7px;

    height:
        7px;

    margin:
        0 auto
        12px;

    border-radius:
        50%;

    background:
        #55f5ff;

    box-shadow:
        0 0 12px
        #00eaff;

    animation:
        pulse
        1.2s
        ease-in-out
        infinite;
}

@keyframes pulse{

    50%{

        transform:
            scale(.65);

        opacity:
            .45;
    }

}

.footer{

    text-align:center;

    margin-top:
        25px;

    font:
        7px Arial;

    letter-spacing:
        1.5px;

    color:
        rgba(160,220,235,.2);
}


@media(max-width:360px){

    .page{

        padding:
            14px
            10px
            25px;
    }

    .duelist-card{

        min-height:
            74px;

        padding:
            10px
            9px;
    }

    .duelist-number{

        width:
            31px;

        height:
            31px;

        margin-right:
            8px;
    }

    .duelist-name{

        font-size:
            10px;
    }

    .duelist-deck{

        font-size:
            5px;
    }

    .duelist-rank{

        width:
            33px;

        height:
            33px;

        margin-left:
            6px;

        font-size:
            16px;
    }

    .duelist-stats{

        min-width:
            42px;

        margin-left:
            5px;
    }

    .duelist-arrow{

        margin-left:
            5px;

        font-size:
            19px;
    }

}

</style>
</head>


<body>


<div class="page">


<header class="header">

    <a
        href="index.html"
        class="back"
        aria-label="Torna alla home">

        ‹

    </a>


    <div class="brand">

        <div class="brand-main">
            ALIS
        </div>

        <div class="brand-sub">
            DUELIST SYSTEM
        </div>

    </div>


    <div class="header-space"></div>

</header>



<div class="section-header">

    <div class="section-line"></div>

    <div class="section-title">
        DUELLANTI
    </div>

    <div class="section-line right"></div>

</div>



<div class="intro">

    SELEZIONA UN DUELLANTE PER VISUALIZZARE IL PROFILO

</div>



<div
    id="duelistList"
    class="duelist-list">

    <div class="loading">

        <div class="loading-dot"></div>

        CARICAMENTO DUELLANTI...

    </div>

</div>



<div class="footer">

    ALIS • DUELIST SYSTEM

</div>


</div>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://swbrwezlygmtsuudwlfg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_uV3FT9S9f6dajA4NRgofFA_cGOCvTNG";


async function supabaseFetch(path) {


    const response =
        await fetch(

            SUPABASE_URL +
            path,

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                },

                cache:
                    "no-store"

            }

        );


    if (!response.ok) {

        throw new Error(
            await response.text()
        );

    }


    return await response.json();

}


/* =========================================================
   NORMALIZZA NOME
========================================================= */

function normalizeName(name) {


    return String(
        name || ""
    )

        .normalize(
            "NFD"
        )

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .trim()

        .toUpperCase();

}


/* =========================================================
   RANK UFFICIALI
========================================================= */

function getRank(name) {


    const n =
        normalizeName(
            name
        );


    /* GABRY + CHRY = S ORO */

    if (

        n === "GABRY" ||

        n === "GABRIELE" ||

        n === "CHRY" ||

        n === "CHRISTIAN" ||

        n === "CHRIS" ||

        n === "CHTY"

    ) {

        return {

            letter:
                "S",

            css:
                "rank-s"

        };

    }


    /* FRA = B ARGENTO */

    if (

        n === "FRA" ||

        n === "FRANCESCO"

    ) {

        return {

            letter:
                "B",

            css:
                "rank-b"

        };

    }


    /* MANU + ALE + GIO = A BRONZO */

    if (

        n === "MANU" ||

        n === "MANUEL" ||

        n === "MANUELE" ||

        n === "ALE" ||

        n === "ALESSANDRO" ||

        n === "GIO" ||

        n === "GIOVANNI"

    ) {

        return {

            letter:
                "A",

            css:
                "rank-a"

        };

    }


    /* ANDREA = C VERDE */

    if (
        n === "ANDREA"
    ) {

        return {

            letter:
                "C",

            css:
                "rank-c"

        };

    }


    return {

        letter:
            "—",

        css:
            "rank-b"

    };

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {


    return String(
        text ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   CARICA DUELLANTI
========================================================= */

async function loadDuelists() {


    const list =
        document.getElementById(
            "duelistList"
        );


    try {


        const players =
            await supabaseFetch(

                "/rest/v1/duellanti" +

                "?select=*" +

                "&order=posizione.asc.nullslast,nome.asc"

            );


        if (
            !players ||
            players.length === 0
        ) {


            list.innerHTML =

                '<div class="empty">' +

                'NESSUN DUELLANTE REGISTRATO' +

                '</div>';


            return;

        }


        list.innerHTML =
            "";


        players.forEach(

            function(
                player,
                index
            ) {


                const rank =
                    getRank(
                        player.nome
                    );


                const card =
                    document.createElement(
                        "a"
                    );


                card.className =
                    "duelist-card";


                /*
                    QUESTA È LA PARTE IMPORTANTE:

                    from=deck dice al profilo
                    che siamo arrivati dall'elenco Deck.
                */

                card.href =

                    "profilo.html?id=" +

                    encodeURIComponent(
                        player.id
                    ) +

                    "&from=deck";


                const deck =

                    player.deck ??

                    player.deck_nome ??

                    player.archetipo ??

                    "DECK";


                const position =

                    player.posizione !== null &&
                    player.posizione !== undefined

                        ? player.posizione +
                          "°"

                        : "—";


                const points =

                    player.punti ??

                    0;


                const name =

                    player.nome ??

                    "DUELLANTE";


                card.innerHTML = `


                    <div class="duelist-number">

                        ${index + 1}

                    </div>


                    <div class="duelist-info">


                        <div class="duelist-label">

                            DUELLANTE

                        </div>


                        <div class="duelist-name">

                            ${escapeHTML(name)}

                        </div>


                        <div class="duelist-deck">

                            ${escapeHTML(deck)}

                        </div>


                    </div>


                    <div
                        class="duelist-rank ${rank.css}">

                        ${rank.letter}

                    </div>


                    <div class="duelist-stats">


                        <div class="mini-stat">

                            <span class="mini-label">
                                POS
                            </span>

                            <span class="mini-value">

                                ${escapeHTML(
                                    position
                                )}

                            </span>

                        </div>


                        <div class="mini-stat">

                            <span class="mini-label">
                                PTS
                            </span>

                            <span class="mini-value">

                                ${escapeHTML(
                                    points
                                )}

                            </span>

                        </div>


                    </div>


                    <div class="duelist-arrow">

                        ›

                    </div>


                `;


                list.appendChild(
                    card
                );

            }

        );


    }

    catch(error) {


        console.error(
            error
        );


        list.innerHTML =

            '<div class="error">' +

            'ERRORE NEL CARICAMENTO DEI DUELLANTI' +

            '</div>';

    }

}


/* =========================================================
   SUONO ALIS
========================================================= */

let audioContext =
    null;


function getAudioContext() {


    if (!audioContext) {


        const AudioContextClass =

            window.AudioContext ||

            window.webkitAudioContext;


        if (!AudioContextClass) {

            return null;

        }


        audioContext =
            new AudioContextClass();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext
            .resume()
            .catch(
                function(){}
            );

    }


    return audioContext;

}


function playSelectionSound() {


    const ctx =
        getAudioContext();


    if (!ctx) {

        return;

    }


    const now =
        ctx.currentTime;


    const sounds = [

        [
            980,
            0,
            .045,
            .035,
            "square",
            1380
        ],

        [
            1650,
            .032,
            .06,
            .022,
            "sine",
            2050
        ]

    ];


    sounds.forEach(

        function(sound) {


            const oscillator =
                ctx.createOscillator();


            const gain =
                ctx.createGain();


            oscillator.type =
                sound[4];


            oscillator.frequency
                .setValueAtTime(

                    sound[0],

                    now +
                    sound[1]

                );


            oscillator.frequency
                .exponentialRampToValueAtTime(

                    sound[5],

                    now +
                    sound[1] +
                    sound[2]

                );


            gain.gain
                .setValueAtTime(

                    .0001,

                    now +
                    sound[1]

                );


            gain.gain
                .exponentialRampToValueAtTime(

                    sound[3],

                    now +
                    sound[1] +
                    .008

                );


            gain.gain
                .exponentialRampToValueAtTime(

                    .0001,

                    now +
                    sound[1] +
                    sound[2]

                );


            oscillator
                .connect(
                    gain
                )
                .connect(
                    ctx.destination
                );


            oscillator.start(

                now +
                sound[1]

            );


            oscillator.stop(

                now +
                sound[1] +
                sound[2] +
                .03

            );

        }

    );

}


document.addEventListener(

    "pointerdown",

    function(event) {


        const target =
            event.target.closest(

                "a," +

                "button," +

                "[role='button']," +

                ".duelist-card," +

                ".mini-stat"

            );


        if (target) {

            playSelectionSound();

        }

    },

    {
        passive:
            true
    }

);


/* =========================================================
   AVVIO
========================================================= */

loadDuelists();


setInterval(

    loadDuelists,

    30000

);

</script>


</body>
